name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: client/pubspec.lock

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Build release APK
        working-directory: client
        run: flutter build apk --release --build-number "${{ github.run_number }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *//p' client/pubspec.yaml | head -n 1)"
          TAG="v${VERSION//+/-}-build.${GITHUB_RUN_NUMBER}"
          APK="client/build/app/outputs/flutter-apk/app-release.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "$TAG" \
              --notes "Automated Android release from main. Commit: ${GITHUB_SHA}"
          fi
