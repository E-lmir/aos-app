name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: client/pubspec.lock

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub secret: ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > client/android/app/upload-keystore.p12

      - name: Build release APK
        working-directory: client
        run: flutter build apk --release --build-number "${{ github.run_number }}"
        env:
          ANDROID_KEYSTORE_PATH: upload-keystore.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Remove Android signing key
        if: always()
        run: rm -f client/android/app/upload-keystore.p12

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *//p' client/pubspec.yaml | head -n 1)"
          TAG="v${VERSION//+/-}-build.${GITHUB_RUN_NUMBER}"
          APK="client/build/app/outputs/flutter-apk/app-release.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "$TAG" \
              --notes "Automated Android release from main. Commit: ${GITHUB_SHA}"
          fi
